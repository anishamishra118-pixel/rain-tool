<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pressure Drop</title>
<style>
  html,body{margin:0;height:100%;background:#fff}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden;font:11px/1 Helvetica,Arial,sans-serif;color:#000}
  canvas{display:block}
  .panel{position:fixed;left:16px;bottom:16px;display:grid;grid-template-columns:auto 120px 36px;gap:8px 10px;align-items:center;letter-spacing:.08em;text-transform:uppercase}
  .panel input[type=range]{width:120px;accent-color:#000}
  .panel output{text-align:right;font-variant-numeric:tabular-nums}
  .ui{position:fixed;right:16px;bottom:16px;display:flex;gap:8px}
  button,select{background:none;border:1px solid #000;color:#000;padding:6px 12px;font:inherit;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  select{padding:5px 8px}
  button:hover{background:#000;color:#fff}
  .hidden .panel,.hidden .ui{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel">
  <span>Pressure</span><input type="range" id="pressure" min="0" max="1" step="0.01" value="0.95"><output></output>
  <span>Resist</span><input type="range" id="resist" min="0" max="1" step="0.01" value="0.35"><output></output>
  <span>Thickness</span><input type="range" id="thick" min="0" max="1" step="0.01" value="0.7"><output></output>
  <span>Morph</span><input type="range" id="morph" min="0" max="2" step="0.05" value="1"><output></output>
  <span>Travel</span><input type="range" id="travel" min="-40" max="40" step="1" value="12"><output></output>
  <span>Creep</span><input type="range" id="creep" min="0" max="80" step="1" value="30"><output></output>
  <span>Swell</span><input type="range" id="swell" min="0" max="0.9" step="0.01" value="0.4"><output></output>
  <span>Blur</span><input type="range" id="blur" min="8" max="60" step="1" value="30"><output></output>
  <span>Haze</span><input type="range" id="haze" min="0.1" max="0.9" step="0.01" value="0.42"><output></output>
  <span>Motion</span><input type="range" id="motion" min="0" max="3" step="0.05" value="1"><output></output>
  <span>Speed</span><input type="range" id="speed" min="0" max="3" step="0.05" value="0.6"><output></output>
  <span>Position</span><input type="range" id="position" min="0" max="360" step="1" value="0"><output></output>
</div>

<div class="ui">
  <button id="pause">Pause</button>
  <button id="save">Save PNG</button>
  <select id="vbg"><option value="#fff">White bg</option><option value="">Transparent (Chrome)</option></select>
  <button id="rec">Record</button>
</div>

<script>
// Press H to hide/show the controls.

// ---- Form (canvas pixels; angles are screen degrees, 0 = right, 90 = bottom) ----
const W = 1200, CX = 600, CY = 610;
const R = 340;            // base radius
const DENT = [112, 52];   // centre and half-width (degrees) of the soft pressed-in wall, lower left
const DEPTH = .27;        // resting depth of the dent (fraction of R)
const PUSH = 1.3;         // how far (× R) the dent is driven in at full pressure — it nearly reaches the far wall
const STROKE = 11;        // resting line thickness
const DENSITY = 1;        // particle density multiplier
const M = 2048;           // samples round the outline per frame

const rad = d => d * Math.PI / 180;
const smooth = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
const band = (x, a, b, r) => smooth(a, a + r, x) * (1 - smooth(b - r, b, x));
const norm360 = d => ((d % 360) + 360) % 360;

// Where the line dissolves into haze: a left arc and a right arc. Each of the four meeting points
// between line and haze drifts on its own irregular rhythm, so the haze grows out of those edges and recedes.
const BASE = [160, 230, -32, 57], EDGE = [...BASE];
function arc(deg, a, b, r) {                       // band from a to b (degrees), wherever it sits on the circle
  const c = (a + b) / 2; let d = norm360(deg - c); if (d > 180) d -= 360;
  return band(c + d, a, b, r);
}
function blurEnv(deg) { return Math.max(arc(deg, EDGE[0], EDGE[1], 16), arc(deg, EDGE[2], EDGE[3], 20)); }
const rnd3 = () => [Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28];
const ESEED = [rnd3(), rnd3(), rnd3(), rnd3()];
const wobble = (t, p) => (Math.sin(t * .37 + p[0]) + .6 * Math.sin(t * .91 + p[1]) + .35 * Math.sin(t * 1.73 + p[2])) / 1.95;
// Travel: the two hazy arcs wander all the way round the ring, at different paces, sometimes meeting
let travelL = 0, travelR = 0;
function moveEdges(t) {
  const oL = travelL + 25 * wobble(t * .5, ESEED[0]), oR = travelR + 25 * wobble(t * .5, ESEED[2]);
  EDGE[0] = BASE[0] + oL - P.creep * wobble(t, ESEED[0]); EDGE[1] = BASE[1] + oL + P.creep * wobble(t, ESEED[1]);
  EDGE[2] = BASE[2] + oR - P.creep * wobble(t, ESEED[2]); EDGE[3] = BASE[3] + oR + P.creep * wobble(t, ESEED[3]);
}
// Soft dent profile (cos² window, no corners)
function dentShape(deg) {
  let d = norm360(deg) - DENT[0]; if (d > 180) d -= 360; if (d < -180) d += 360;
  return Math.abs(d) >= DENT[1] ? 0 : Math.cos(Math.PI / 2 * d / DENT[1]) ** 2;
}
// Shoulders: either side of the pressed wall, where resistance gathers
const shoulder = deg => {
  let d = norm360(deg) - DENT[0]; if (d > 180) d -= 360;
  const a = (Math.abs(d) - DENT[1] * .75) / 14; return Math.exp(-a * a);
};

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = cv.height = W;
const img = ctx.createImageData(W, W), u32 = new Uint32Array(img.data.buffer), acc = new Float32Array(W * W);

const P = {};
const ids = ['pressure', 'resist', 'thick', 'morph', 'travel', 'creep', 'swell', 'blur', 'haze', 'motion', 'speed', 'position'];
function readControls() {
  for (const id of ids) { const el = document.getElementById(id); P[id] = +el.value; el.nextElementSibling.textContent = P[id]; }
}
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

// ---- Per-frame outline table ----
const LX = new Float32Array(M), LY = new Float32Array(M), NX = new Float32Array(M), NY = new Float32Array(M);
const TH = new Float32Array(M), SP = new Float32Array(M), BL = new Float32Array(M), RR = new Float32Array(M);
const HX = new Float32Array(M), HY = new Float32Array(M), KP = new Float32Array(M);   // smoothed normals for the haze (no fanning at corners)
const DS = new Float32Array(M), SH = new Float32Array(M), BU = new Float32Array(M), SW = new Float32Array(M), LB = new Float32Array(M), MK = new Float32Array(M);
// jellyfish body: slow travelling ripples + haze swell modes
const JM = [[2, -.5, .05], [3, .37, .035], [4, -.8, .02], [5, .61, .012]].map(([k, w, a]) => [k, w, a, Math.random() * 6.28]);
const SM = [[2, .23], [3, .41], [5, .67], [7, .53]].map(([k, w]) => [k, w, Math.random() * 6.28]);
for (let j = 0; j < M; j++) {                      // static profiles
  const deg = j / M * 360;
  DS[j] = dentShape(deg); SH[j] = shoulder(deg);
  const win = (c, h) => { let d = norm360(deg - c); if (d > 180) d -= 360; return Math.abs(d) >= h ? 0 : Math.cos(Math.PI / 2 * d / h) ** 2; };
  { let d = Math.abs(norm360(deg - DENT[0])); if (d > 180) d = 360 - d;
    // how much each point is carried in by the push: a broad flat-bottomed band with a soft extra dip
    // in the middle, so the dent deepens into a rounded U rather than a point
    BU[j] = .8 * (1 - smooth(16, 100, d)) + .2 * win(DENT[0], 45); }
  LB[j] = Math.max(win(22, 62), win(202, 62));                // the two arms of the U bulge out as it stretches
  MK[j] = 1 - win(DENT[0], 88);                               // haze never enters the stretched U
}

// Pressure cycle: a slow stretch to the brink of splitting, a trembling hold, then a smooth release.
// It never fully lets go, so the bean always keeps a little of its pinch. Each cycle differs a little.
const CYCLE = 8, FLOOR = .22;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function press(t) {
  const c = Math.floor(t / CYCLE), u = t - c * CYCLE;
  const peak = .8 + .2 * hash(c), load = CYCLE * (.42 + .14 * hash(c + 9)), hold = .5 + .4 * hash(c + 3);
  if (u < load) return FLOOR + (peak - FLOOR) * smooth(0, load, u);
  if (u < load + hold) return peak;
  return peak - (peak - FLOOR) * smooth(load + hold, CYCLE, u);   // eases back, no bounce
}
let holding = 0;

function buildOutline(t) {
  moveEdges(t);
  const p = press(t) * P.pressure, pp = Math.max(0, p);
  const tremor = P.resist * pp * pp * .025 * (Math.sin(t * 11.3) + .6 * Math.sin(t * 17.9 + 1));   // it trembles as it resists
  // the push comes from one side only: the dent wall is carried straight in, toward the far side,
  // deepening into a distorted U; the far side stays whole
  const push = R * (PUSH * p + tremor * 4), px = -Math.cos(rad(DENT[0])), py = -Math.sin(rad(DENT[0]));
  // bell pulse: a quick squeeze (sides in, top and bottom out) then a slow relax, like a jellyfish
  const bell = P.morph * .05 * Math.pow(.5 + .5 * Math.sin(t * .9), 4);
  const sw = P.swell / 2.2;
  for (let j = 0; j < M; j++) {
    const deg = j / M * 360, a = rad(deg);
    let jelly = -bell * Math.cos(2 * a);
    for (const [k, w, amp, ph] of JM) jelly += P.morph * amp * Math.sin(k * a + w * t + ph);
    RR[j] = R * (1 + .05 * Math.cos(rad(deg - 60))) * (1 - DEPTH * DS[j]) * (1 + .3 * p * LB[j]) * (1 + jelly);
    BL[j] = blurEnv(deg) * MK[j];
    let pulse = 0; for (const [k, w, ph] of SM) pulse += Math.sin(k * a + w * t + ph);
    SW[j] = Math.max(.5, 1 + sw * pulse);        // uneven outward swell of the haze
  }
  for (let j = 0; j < M; j++) {
    const a = j / M * 2 * Math.PI, d = push * BU[j];
    LX[j] = CX + RR[j] * Math.cos(a) + px * d; LY[j] = CY + RR[j] * Math.sin(a) + py * d;
  }
  for (let j = 0; j < M; j++) {
    const q = (j + 1) % M, o = (j - 1 + M) % M, tx = LX[q] - LX[o], ty = LY[q] - LY[o];
    const l = Math.hypot(tx, ty) || 1e-3;
    NX[j] = ty / l; NY[j] = -tx / l;                           // outward normal
    SP[j] = l / (2 * 2 * Math.PI / M);                         // px per radian along the line
    // thickness: thinner where pressed, thicker where it resists; dent wall is finer at rest
    // thickness: the line stretches thread-thin at the waist and gathers at the shoulders
    TH[j] = STROKE * (1 - .5 * DS[j]) * Math.max(.12, 1 - P.thick * .85 * pp * BU[j] - .25 * pp * LB[j])
          * (1 + P.thick * .9 * pp * SH[j]);
  }
  const K = 40;
  for (let j = 0; j < M; j++) {
    let sx = 0, sy = 0;
    for (let k = -K; k <= K; k += 4) { const q = (j + k + M) % M; sx += NX[q]; sy += NY[q]; }
    const l = Math.hypot(sx, sy) || 1; HX[j] = sx / l; HY[j] = sy / l;
  }
  // how much the haze spreads or bunches as it moves out from the line (stops dark streaks on inward bends)
  const s0 = 50;
  for (let j = 0; j < M; j++) {
    const q = (j + 1) % M;
    const d0 = Math.hypot(LX[q] - LX[j], LY[q] - LY[j]) || 1e-3;
    const d1 = Math.hypot(LX[q] + HX[q] * s0 - LX[j] - HX[j] * s0, LY[q] + HY[q] * s0 - LY[j] - HY[j] * s0);
    KP[j] = (d1 / d0 - 1) / s0;
  }
}

// ---- Particles ----
let NS, NHZ, sA, sU, sW, sG, sJ, hA, hN, hW, hG, hJs, hJc;
const GROUPS = 8, OM = Array.from({ length: GROUPS }, (_, g) => .8 + g * .3);
function build() {
  NS = Math.round(DENSITY * 2.4 * 2 * Math.PI * R * STROKE);       // the line
  NHZ = Math.round(DENSITY * 9 * 2 * Math.PI * R * 30);          // the haze
  sA = new Float32Array(NS); sU = new Float32Array(NS); sW = new Float32Array(NS); sG = new Uint8Array(NS); sJ = new Float32Array(NS);
  hA = new Float32Array(NHZ); hN = new Float32Array(NHZ); hW = new Float32Array(NHZ); hG = new Uint8Array(NHZ);
  hJs = new Float32Array(NHZ); hJc = new Float32Array(NHZ);
  for (let i = 0; i < NS; i++) {
    sA[i] = Math.random(); sU[i] = Math.random() - .5;
    sW[i] = (Math.random() - .5) * .02;                          // drift along the line, both ways
    sG[i] = (Math.random() * GROUPS) | 0; sJ[i] = Math.random() * 6.28;
  }
  for (let i = 0; i < NHZ; i++) {
    hA[i] = Math.random(); hN[i] = .8 * gauss() + .55;            // biased outward, a little inward
    hW[i] = (Math.random() - .5) * .012; hG[i] = (Math.random() * GROUPS) | 0;
    const j = Math.random() * 6.28; hJs[i] = Math.sin(j); hJc[i] = Math.cos(j);
  }
}

function splat(x, y, w) {
  const x0 = x | 0, y0 = y | 0;
  if (x0 < 0 || y0 < 0 || x0 >= W - 1 || y0 >= W - 1) return;
  const fx = x - x0, fy = y - y0, i = y0 * W + x0;
  acc[i] += w * (1 - fx) * (1 - fy); acc[i + 1] += w * fx * (1 - fy);
  acc[i + W] += w * (1 - fx) * fy; acc[i + W + 1] += w * fx * fy;
}

const cg = new Float32Array(GROUPS), sg = new Float32Array(GROUPS);
let tau = 0, last = performance.now(), paused = false, dirty = false;

function render() {
  buildOutline(tau);
  for (let g = 0; g < GROUPS; g++) { cg[g] = Math.cos(OM[g] * tau); sg[g] = Math.sin(OM[g] * tau); }
  const off = P.position / 360, mo = P.motion, sig = P.blur, TWO_PI = 2 * Math.PI;
  const rot = rad(P.position), cr = Math.cos(rot), sr = Math.sin(rot);
  const place = (x, y) => [CX + (x - CX) * cr - (y - CY) * sr, CY + (x - CX) * sr + (y - CY) * cr];
  acc.fill(0);

  // the line: solid where crisp, fading out where the haze takes over
  const ws = 1.35 * TWO_PI / NS;
  for (let i = 0; i < NS; i++) {
    let a = (sA[i] + sW[i] * mo * tau) % 1; if (a < 0) a += 1;
    const j = (a * M) | 0, vis = 1 - BL[j];
    if (vis < .02) continue;
    const g = sG[i], u = sU[i] + .06 * mo * Math.sin(sJ[i] + OM[g] * tau) * (Math.abs(sU[i]) < .4 ? 1 : 0);
    const th = TH[j], n = u * th;
    const [x, y] = place(LX[j] + NX[j] * n, LY[j] + NY[j] * n);
    splat(x, y, vis * ws * SP[j] * th);
  }

  // the haze: soft grey band in the blurred arcs
  const wh = P.haze * TWO_PI * .8 * sig * 2.5066 / NHZ, A = 2.5 * mo;
  for (let i = 0; i < NHZ; i++) {
    let a = (hA[i] + hW[i] * mo * tau) % 1; if (a < 0) a += 1;
    const j = (a * M) | 0, b = BL[j];
    if (b < .02) continue;
    const g = hG[i], ca = cg[g], sa = sg[g];
    const n = hN[i] * sig * SW[j];
    const [x, y] = place(LX[j] + HX[j] * n + A * (hJc[i] * ca - hJs[i] * sa), LY[j] + HY[j] * n + A * (hJs[i] * ca + hJc[i] * sa));
    splat(x, y, b * wh * SP[j] / Math.sqrt(SW[j]) / Math.max(.35, 1 + KP[j] * n));
  }

  for (let i = 0, n = W * W; i < n; i++) {
    const v = acc[i];
    u32[i] = v <= 0 ? 0 : (v >= 1 ? 255 : (v * 255) | 0) << 24;   // black, alpha = density
  }
  ctx.putImageData(img, 0, 0);
  copyToRec();
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused) { tau += dt * P.speed; travelL += dt * P.speed * P.travel; travelR += dt * P.speed * P.travel * .72; }
  if (!paused || dirty) { render(); dirty = false; }
  requestAnimationFrame(frame);
}

function fit() { const s = Math.min(innerWidth, innerHeight); cv.style.width = cv.style.height = s + 'px'; }
addEventListener('resize', fit);
for (const id of ids) document.getElementById(id).addEventListener('input', () => { readControls(); dirty = true; });
addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hidden'); });
document.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Play' : 'Pause'; };

const download = (blob, file) => {
  const l = document.createElement('a'); l.href = URL.createObjectURL(blob);
  l.download = file; l.click(); setTimeout(() => URL.revokeObjectURL(l.href), 1000);
};
document.getElementById('save').onclick = () => cv.toBlob(b => download(b, 'pressure-drop.png'));

// ---- Record (click again to stop) ----
const rc = document.createElement('canvas'), rctx = rc.getContext('2d');
const recBtn = document.getElementById('rec'), vbg = document.getElementById('vbg');
let rec = null;
function copyToRec() {
  if (!rec) return;
  rctx.clearRect(0, 0, W, W);
  if (vbg.value) { rctx.fillStyle = vbg.value; rctx.fillRect(0, 0, W, W); }
  rctx.drawImage(cv, 0, 0);
}
recBtn.onclick = () => {
  if (rec) { rec.stop(); return; }
  const type = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4']
    .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!type) { alert('Video recording is not supported in this browser. Try Chrome.'); return; }
  rc.width = rc.height = W;
  const chunks = [];
  rec = new MediaRecorder(rc.captureStream(30), { mimeType: type, videoBitsPerSecond: 12e6 });
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    download(new Blob(chunks, { type }), 'pressure-drop' + (type.includes('mp4') ? '.mp4' : '.webm'));
    rec = null; recBtn.textContent = 'Record';
  };
  copyToRec(); rec.start(); recBtn.textContent = 'Stop';
};

readControls(); build(); fit(); requestAnimationFrame(frame);
</script>
</body>
</html>
